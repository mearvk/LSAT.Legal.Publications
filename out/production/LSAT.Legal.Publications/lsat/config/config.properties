# LSAT Moral Assessment — Configuration
# ──────────────────────────────────────────────
#
# Font Settings
#   font.family: SansSerif, Serif, Monospaced, Dialog, or any installed font
#   font.size: integer (12–36 recommended)
#   font.color: hex color (#RRGGBB) or named: white, black, green, gold, cyan
#
# Test Difficulty
#   test.difficulty: easy, moderate, standard, hard, expert
#     easy     — more time, relaxed scoring
#     moderate — slightly more time than standard
#     standard — default (21–24s per question)
#     hard     — less time, stricter curve
#     expert   — minimal time, strict curve, no bonus time
#
# Language
#   test.language: english, spanish, french, american_prudent, german, greek
#
# Title Bar Double-Click Action
#   titlebar.doubleclick: go_back, pause
#     go_back — prompts the user to return to the initial/welcome frame
#     pause   — pauses the current test (stops timer, disables input)
#
# Symbol Definition (𓈌 menu item)
#   symbol.definition: text displayed when the 𓈌 symbol is clicked
#     Fades after 5 seconds automatically.
#
# Curve & Pacing Adjustment
#   curve.weights: comma-separated list of descriptor:integer pairs (10 points)
#     Each entry is label:value where value is 0–200 (represents weight × 100)
#     Default follows a standard deviation (Gaussian) curve.
#     Example: Beginning:20,Point2:45,Point3:72,Point4:90,Point5:98,Middle:100,Point7:98,Point8:90,Point9:72,End:45
#     Descriptors are freeform labels; integers control pacing weight at that segment.
#
# Frame Corner Radius
#   frame.corner.radius: percentage of frame height for bottom corner rounding (0–50)
#     0 = no rounding, 28 = 28% of height as arc radius on bottom corners
#     Only bottom corners are rounded; top remains square for the title bar.
#
# Button 3D Gloss Gradient
#   button.gloss: comma-separated integers controlling the linear gradient effect
#     Format: topAlpha,glossPercent,shadowDepth,shadowAlpha,outlineAlpha,arcRadius
#       topAlpha     — gloss highlight opacity at top (0–255)
#       glossPercent — height of gloss region as % of button (0–100)
#       shadowDepth  — bottom shadow height in pixels (0–20)
#       shadowAlpha  — bottom shadow opacity (0–255)
#       outlineAlpha — border outline opacity (0–255)
#       arcRadius    — rounded corner radius in pixels (0–30)
#
# ──────────────────────────────────────────────

font.family=Dialog
font.size=20
font.color=#FFFFFF
test.difficulty=standard
test.language=english
titlebar.doubleclick=go_back
symbol.definition=The State has an interest in Human Domomy of at $300,000,000 per Second per Ant of Human Anatomy.
curve.weights=Beginning:20,Early:45,Rising:72,Building:90,Approaching:98,Middle:100,Sustaining:98,Declining:90,Waning:72,End:45
frame.corner.radius=8
button.gloss=120,25,8,50,40,12
